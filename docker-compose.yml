services:
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: on-failure
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - SPRING_FLYWAY_VALIDATE_ON_MIGRATE=false
      - BACKEND_PORT=8080
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-validate}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - FLYWAY_LOCATIONS=${FLYWAY_LOCATIONS:-classpath:db/migration}
      - FLYWAY_BASELINE_ON_MIGRATE=${FLYWAY_BASELINE_ON_MIGRATE:-true}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL}
      - UPLOAD_BASE_PATH=${UPLOAD_BASE_PATH}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-259200}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-20MB}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-25MB}
    volumes:
      - uploaded_files:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      rag-service:
        condition: service_started

  rag-service:
    build: ./rag-service
    ports:
      - "${RAG_PORT:-8001}:8001"
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - LLM_API_KEY_2=${GOOGLE_API_KEY_2}
      - LLM_API_KEY_3=${GOOGLE_API_KEY_3}
      - LLM_API_KEY_4=${GOOGLE_API_KEY_4}
      - LLM_API_KEY_5=${GOOGLE_API_KEY_5}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - DEFAULT_CHUNK_SIZE=${DEFAULT_CHUNK_SIZE:-800}
      - DEFAULT_CHUNK_OVERLAP=${DEFAULT_CHUNK_OVERLAP:-120}
      - DEFAULT_TOP_K=${DEFAULT_TOP_K:-5}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.5}
      - WEB_FALLBACK_ENABLED=${WEB_FALLBACK_ENABLED:-true}
      - WEB_FALLBACK_MAX_CHARS=${WEB_FALLBACK_MAX_CHARS:-2000}
    volumes:
      - /Volumes/SSD/RAG-history-pdfs:/data/pdfs:ro
    depends_on:
      - qdrant
      - neo4j

  mysql:
    image: mysql:8
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data

volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
  uploaded_files:
