server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: history-rag-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/history_rag}
    username: ${MYSQL_USER:history}
    password: ${MYSQL_PASSWORD:history_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
jwt:
  secret-key: ${JWT_SECRET_KEY}
  # 15 minutes
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  # 3 days
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:259200}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [history-rag-backend,%X{traceId},%X{spanId}]"

app:
  rag:
    base-url: ${RAG_SERVICE_URL:http://localhost:8001}
    request-timeout: ${RAG_SERVICE_REQUEST_TIMEOUT:60s}
  upload:
    base-path: ${UPLOAD_BASE_PATH:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
